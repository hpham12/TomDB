name: PR-check

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: hpham99/tomdb:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  coverage:
    needs: test
    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    container:
      image: hpham99/tomdb:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build-coverage -DENABLE_COVERAGE=ON

      - name: Coverage
        run: cmake --build build-coverage --target coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@5bc5285b684b9f0e940031dc8ddc4b6387a2f493
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}