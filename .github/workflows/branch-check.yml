name: Branch check

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: hpham99/tomdb:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
