name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: hpham99/tomdb:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build-coverage -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build-coverage --target coverage

      - name: Test
        run: ctest --test-dir build --output-on-failure